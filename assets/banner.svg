<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="celestial-void" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#070c17" />
      <stop offset="60%" stop-color="#03050a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- The Telegram Body Glow (Azure) -->
    <radialGradient id="tg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <!-- The Matrix Body Glow (Jade) -->
    <radialGradient id="matrix-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- The Pi Core / Corona Eclipse Glow (Amber) -->
    <radialGradient id="pi-corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="1"/>
      <stop offset="10%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="corona-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <!-- Subtle horizontal atmospheric band -->
    <linearGradient id="horizon-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="stardust" width="300" height="300" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="50" r="0.8" fill="#e2e8f0" fill-opacity="0.3" />
      <circle cx="180" cy="120" r="1.2" fill="#e2e8f0" fill-opacity="0.1" />
      <circle cx="250" cy="270" r="0.5" fill="#f59e0b" fill-opacity="0.4" />
      <circle cx="80" cy="210" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Deep Cosmic Void -->
  <rect width="1200" height="420" fill="#000000" />
  <rect width="1200" height="420" fill="url(#celestial-void)" />
  <rect width="1200" height="420" fill="url(#stardust)" />

  <!-- A subtle horizontal axis line (Event Horizon) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="url(#horizon-band)" stroke-width="1" />

  <g transform="translate(600, 210)">
    
    <!-- The Convergence bodies -->
    <!-- Matrix Sphere (Left) -->
    <circle cx="-60" cy="0" r="160" fill="url(#matrix-glow)" />
    <!-- Telegram Sphere (Right) -->
    <circle cx="60" cy="0" r="160" fill="url(#tg-glow)" />

    <!-- The Silhouettes of the eclipseing bodies -->
    <circle cx="-60" cy="0" r="100" fill="#020508" stroke="#059669" stroke-width="0.5" stroke-opacity="0.4"/>
    <circle cx="60" cy="0" r="100" fill="#020408" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- The intersection / Corona (Pi Agent Core) -->
    <!-- Glow -->
    <circle cx="0" cy="0" r="140" fill="url(#pi-corona)" filter="url(#corona-blur)" />
    <!-- Intense Center -->
    <ellipse cx="0" cy="0" rx="4" ry="40" fill="#ffffff" filter="url(#corona-blur)" />
    <ellipse cx="0" cy="0" rx="40" ry="4" fill="#ffffff" filter="url(#corona-blur)" />
    <circle cx="0" cy="0" r="18" fill="#fcd34d" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#000000" />
  </g>

  <!-- Epic Minimalist Typography -->
  <g transform="translate(60, 360)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', serif" font-size="28" font-weight="200" fill="#f8fafc" letter-spacing="12">
      P I — M A T R I X
    </text>
    <text x="4" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9" font-weight="400" fill="#94a3b8" letter-spacing="6" opacity="0.6">
      ZERO-TOKEN PROTOCOL BRIDGES
    </text>
  </g>

  <!-- Delicate Frame -->
  <rect x="30" y="30" width="1140" height="360" fill="none" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.05" />

  <text x="45" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" letter-spacing="3" opacity="0.4">
    EXT: TELEGRAM
  </text>
  <text x="1155" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" letter-spacing="3" text-anchor="end" opacity="0.4">
    EXT: MATRIX
  </text>

</svg>